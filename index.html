<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be Black or White</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0c0c0c;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Consolas', 'Courier New', monospace;
  }

  .terminal {
    width: min(720px, 90vw);
    background: #0f1110;
    border: 1px solid #262626;
    border-radius: 6px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    overflow: hidden;
  }

  .title-bar {
    background: #1a1c1a;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid #262626;
  }

  .dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
  }
  .dot.red { background: #ff5f56; }
  .dot.yellow { background: #ffbd2e; }
  .dot.green { background: #27c93f; }

  .title-text {
    flex: 1;
    text-align: center;
    color: #7a7a7a;
    font-size: 12px;
    letter-spacing: 0.5px;
  }

  .body {
    padding: 22px 26px 30px;
    min-height: 220px;
    color: #c9c9c9;
    font-size: 14px;
    line-height: 1.7;
  }

  .line {
    white-space: pre-wrap;
    word-break: break-word;
  }

  .prompt {
    color: #4ec9b0;
  }
  .path {
    color: #569cd6;
  }
  .cmd {
    color: #d4d4d4;
  }
  .comment {
    color: #6a9955;
  }

  .result {
    color: #ffffff;
    font-weight: 700;
    letter-spacing: 1px;
    margin-top: 6px;
  }

  .cursor {
    display: inline-block;
    width: 8px;
    height: 15px;
    background: #d4d4d4;
    vertical-align: middle;
    margin-left: 2px;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }

  #typed-final {
    font-size: 20px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

  <div class="terminal">
    <div class="title-bar">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
      <div class="title-text">bash — 80x24</div>
    </div>
    <div class="body" id="output"></div>
  </div>

<script>
  const output = document.getElementById('output');

  const script = [
    { type: 'cmd', prompt: 'root@kali', path: '~', text: 'whoami' },
    { type: 'out', text: 'root' },
    { type: 'cmd', prompt: 'root@kali', path: '~', text: 'echo $MINDSET' },
    { type: 'final', text: 'Be black or white' }
  ];

  let lineIndex = 0;

  function typeLine(el, text, speed, callback) {
    let i = 0;
    function tick() {
      if (i <= text.length) {
        el.textContent = text.slice(0, i);
        i++;
        setTimeout(tick, speed);
      } else if (callback) {
        callback();
      }
    }
    tick();
  }

  function nextLine() {
    if (lineIndex >= script.length) return;
    const item = script[lineIndex];
    const div = document.createElement('div');
    div.className = 'line';
    output.appendChild(div);

    if (item.type === 'cmd') {
      const prefix = document.createElement('span');
      prefix.innerHTML = `<span class="prompt">${item.prompt}</span>:<span class="path">${item.path}</span><span class="cmd">$ </span>`;
      div.appendChild(prefix);
      const cmdSpan = document.createElement('span');
      cmdSpan.className = 'cmd';
      div.appendChild(cmdSpan);
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      div.appendChild(cursor);

      typeLine(cmdSpan, item.text, 55, () => {
        cursor.remove();
        lineIndex++;
        setTimeout(nextLine, 350);
      });
    } else if (item.type === 'out') {
      div.className = 'line comment';
      div.textContent = item.text;
      lineIndex++;
      setTimeout(nextLine, 400);
    } else if (item.type === 'final') {
      div.id = 'typed-final';
      div.className = 'line result';
      const cursor = document.createElement('span');
      cursor.className = 'cursor';

      typeLine(div, item.text, 90, () => {
        div.appendChild(cursor);
        lineIndex++;
      });
    }
  }

  nextLine();
</script>

</body>
</html>
